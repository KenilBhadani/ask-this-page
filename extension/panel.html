<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask this page</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </span>
      <div>
        <h1>Ask this page</h1>
        <p class="tagline">Chat with the page you're reading</p>
      </div>
    </div>
    <button id="new-chat" class="ghost" type="button">New chat</button>
  </header>

  <p id="info"></p>

  <section id="welcome" class="welcome">
    <h2>Ask anything about this page</h2>
    <p>Answers cite their sources. Click a number to jump to that passage on the page.</p>
    <div class="starters">
      <button type="button" class="starter" data-question="Summarize this page in a few sentences.">Summarize this page</button>
      <button type="button" class="starter" data-question="List the key points of this page as bullet points.">Key points</button>
    </div>
  </section>

  <div id="chat" aria-label="Conversation"></div>

  <footer class="composer">
    <div class="composer-box">
      <input id="question" type="text" placeholder="Ask anything about this page" autocomplete="off">
      <button id="send" type="button" aria-label="Send question" title="Send">
        <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
        <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg>
      </button>
    </div>
    <p class="hint">Answers come from this page's text and can contain mistakes.</p>
  </footer>

  <script src="panel.js"></script>
</body>
</html>
