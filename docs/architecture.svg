<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Architecture of Ask this page</title>
  <desc id="desc">The extension reads the page text and sends it with the question to a local FastAPI backend. The backend chunks, embeds and searches long pages with FastEmbed and FAISS, then asks the Groq API. The answer streams back with its source passages, and clicking a citation highlights it on the page.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="383" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">

    <!-- Main boxes -->
    <rect x="20" y="90" width="160" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="100" y="121" font-size="14" font-weight="600" fill="#1f2937">Web page</text>
    <text x="100" y="141" font-size="12" fill="#4b5563">Visible text (DOM)</text>

    <rect x="230" y="90" width="180" height="70" rx="10" fill="#eef2ff" stroke="#6366f1"/>
    <text x="320" y="121" font-size="14" font-weight="600" fill="#1f2937">Extension side panel</text>
    <text x="320" y="141" font-size="12" fill="#4b5563">Chat UI and citations</text>

    <rect x="460" y="90" width="180" height="70" rx="10" fill="#ecfdf5" stroke="#10b981"/>
    <text x="550" y="121" font-size="14" font-weight="600" fill="#1f2937">FastAPI backend</text>
    <text x="550" y="141" font-size="12" fill="#4b5563">Runs locally</text>

    <rect x="690" y="90" width="170" height="70" rx="10" fill="#fff7ed" stroke="#f97316"/>
    <text x="775" y="121" font-size="14" font-weight="600" fill="#1f2937">Groq API</text>
    <text x="775" y="141" font-size="12" fill="#4b5563">Free-tier LLM</text>

    <!-- Backend internals -->
    <g stroke="#10b981" stroke-width="1.5" fill="none">
      <line x1="550" y1="162" x2="550" y2="185"/>
      <line x1="503" y1="185" x2="597" y2="185"/>
      <line x1="503" y1="185" x2="503" y2="205"/>
      <line x1="597" y1="185" x2="597" y2="205"/>
    </g>
    <rect x="460" y="205" width="86" height="56" rx="8" fill="#f0fdfa" stroke="#10b981"/>
    <text x="503" y="229" font-size="13" font-weight="600" fill="#1f2937">FastEmbed</text>
    <text x="503" y="246" font-size="11" fill="#4b5563">embeddings</text>
    <rect x="554" y="205" width="86" height="56" rx="8" fill="#f0fdfa" stroke="#10b981"/>
    <text x="597" y="229" font-size="13" font-weight="600" fill="#1f2937">FAISS</text>
    <text x="597" y="246" font-size="11" fill="#4b5563">vector search</text>

    <!-- Arrows -->
    <g stroke="#374151" stroke-width="1.8" fill="none">
      <line x1="182" y1="125" x2="228" y2="125" marker-end="url(#arrow)"/>
      <line x1="412" y1="125" x2="458" y2="125" marker-end="url(#arrow)"/>
      <line x1="642" y1="125" x2="688" y2="125" marker-end="url(#arrow)"/>
      <path d="M550 88 V50 H320 V86" marker-end="url(#arrow)"/>
      <path d="M320 162 V205 H100 V164" marker-end="url(#arrow)"/>
    </g>

    <!-- Step numbers -->
    <g fill="#111827">
      <circle cx="205" cy="107" r="10"/>
      <circle cx="435" cy="107" r="10"/>
      <circle cx="665" cy="107" r="10"/>
      <circle cx="435" cy="50" r="10"/>
      <circle cx="210" cy="205" r="10"/>
    </g>
    <g font-size="12" font-weight="700" fill="#ffffff">
      <text x="205" y="111">1</text>
      <text x="435" y="111">2</text>
      <text x="665" y="111">3</text>
      <text x="435" y="54">4</text>
      <text x="210" y="209">5</text>
    </g>

    <!-- Arrow labels -->
    <text x="435" y="30" font-size="12" fill="#4b5563">streamed answer + sources</text>
    <text x="210" y="234" font-size="12" fill="#4b5563">highlight cited passage</text>
  </g>

  <!-- Legend -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#374151">
    <text x="40" y="294"><tspan font-weight="700">1</tspan>  The extension reads the text of the open page directly from the browser.</text>
    <text x="40" y="312"><tspan font-weight="700">2</tspan>  The panel sends the question and the page text to the local backend.</text>
    <text x="40" y="330"><tspan font-weight="700">3</tspan>  The backend sends numbered passages (all of a short page, the best chunks of a long one) to Groq.</text>
    <text x="40" y="348"><tspan font-weight="700">4</tspan>  The answer streams back to the panel together with the passages it was based on.</text>
    <text x="40" y="366"><tspan font-weight="700">5</tspan>  Clicking a citation finds that passage on the page, scrolls to it, and highlights it.</text>
  </g>
</svg>
